server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : réduit la taille des fichiers JS/CSS envoyés au navigateur
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Route toutes les requêtes API vers FastAPI (nom "backend" résolu par
    # le DNS interne de Docker Compose, sur le réseau app-network).
    # Pas de chemin après "backend:8000" ci-dessous : Nginx transmet donc
    # l'URI d'origine telle quelle (/api/dashboard/stats reste
    # /api/dashboard/stats côté backend), ce qui correspond aux routes
    # FastAPI qui sont déjà préfixées par /api.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les imports .xlsb peuvent être volumineux
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # Cache long terme pour les assets buildés par Vite (nom de fichier
    # contient un hash, donc un nouveau build = nouveau nom = pas de
    # problème de cache périmé)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Toute autre route : on sert index.html et on laisse React Router
    # gérer la navigation côté client (indispensable pour une SPA —
    # sinon un F5 sur /engagements renvoie une 404 Nginx)
    location / {
        try_files $uri $uri/ /index.html;
    }
}